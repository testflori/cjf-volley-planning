<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJF Volley — Planning</title>
<style>
  :root {
    --bleu: #0b3d91;
    --bleu-clair: #e8f0fe;
    --vert: #1a8f4c;
    --gris: #6b7280;
    --bord: #e2e5ea;
    --fond: #f7f8fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--fond);
    color: #1a1d23;
  }
  header {
    background: var(--bleu);
    color: white;
    padding: 20px 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.85; }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
  }

  #tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  #tabs button {
    border: 1px solid var(--bord);
    background: white;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
    color: #444;
  }
  #tabs button.active {
    background: var(--bleu);
    color: white;
    border-color: var(--bleu);
  }

  #views {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  #views button {
    flex: 1;
    border: 1px solid var(--bleu);
    background: white;
    color: var(--bleu);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  #views button.active {
    background: var(--bleu);
    color: white;
  }

  table.stats-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border: 1px solid var(--bord);
    border-radius: 10px;
    overflow: hidden;
    font-size: 0.85rem;
  }
  table.stats-table th, table.stats-table td {
    padding: 9px 10px;
    text-align: center;
    border-bottom: 1px solid var(--bord);
  }
  table.stats-table th {
    background: var(--bleu-clair);
    color: var(--bleu);
    font-size: 0.75rem;
    text-transform: uppercase;
  }
  table.stats-table td:first-child, table.stats-table th:first-child {
    text-align: left;
  }
  table.stats-table tr:last-child td { border-bottom: none; }
  table.stats-table .cat-label {
    display: block;
    font-size: 0.72rem;
    color: var(--gris);
    font-weight: 400;
  }
  .bilan-v { color: var(--vert); font-weight: 700; }
  .bilan-d { color: #c0392b; font-weight: 700; }
  .stats-note {
    font-size: 0.75rem;
    color: var(--gris);
    text-align: center;
    margin-top: 10px;
  }

  #home-filter {
    display: flex;
    align-items: center;
    gap: 7px;
    width: fit-content;
    margin: 0 auto 14px;
    padding: 7px 14px;
    background: white;
    border: 1px solid var(--bord);
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    color: #444;
    cursor: pointer;
    user-select: none;
  }
  #home-filter:has(input:checked) {
    background: var(--vert);
    border-color: var(--vert);
    color: white;
  }
  #home-filter input {
    accent-color: var(--vert);
    cursor: pointer;
  }

  #status {
    font-size: 0.8rem;
    color: var(--gris);
    text-align: center;
    margin-bottom: 16px;
  }

  .week-group {
    margin-bottom: 22px;
  }
  .week-group h2 {
    font-size: 0.95rem;
    color: var(--bleu);
    border-bottom: 2px solid var(--bleu-clair);
    padding-bottom: 6px;
    margin: 0 0 10px;
  }

  .match-card {
    background: white;
    border: 1px solid var(--bord);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .match-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .match-datetime {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .match-datetime .jour {
    font-weight: 600;
    font-size: 0.9rem;
    text-transform: capitalize;
  }
  .match-datetime .heure {
    font-size: 0.8rem;
    color: var(--gris);
  }
  .cat-chip {
    display: inline-flex;
    align-items: center;
    flex: none;
  }
  .cat-chip img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    flex: none;
  }
  .cat-chip .cat-fallback {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--bleu);
    color: white;
    font-size: 0.85rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  .scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .team-col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }
  .team-logo {
    width: 120px;
    height: 120px;
    object-fit: contain;
    border-radius: 8px;
    flex: none;
  }
  .team-logo-fallback {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--bleu-clair);
    color: var(--bleu);
    font-size: 2rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .team-name {
    font-size: 0.78rem;
    line-height: 1.25;
    max-width: 100%;
  }
  .team-col.cjf .team-name {
    font-weight: 700;
    color: var(--bleu);
  }
  .vs-sep {
    flex: none;
    color: #999;
    font-size: 0.8rem;
    font-weight: 600;
  }

  header .cjf-logo {
    width: 44px;
    height: 44px;
    object-fit: contain;
    border-radius: 8px;
    vertical-align: middle;
    margin-right: 8px;
    background: white;
    padding: 3px;
  }
  .match-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--fond);
  }
  .lieu {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--gris);
  }
  .venue-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 10px;
    flex: none;
  }
  .venue-badge.domicile {
    background: #e2f6ea;
    color: var(--vert);
  }
  .venue-badge.exterieur {
    background: #fdeee0;
    color: #b9660c;
  }
  .match-score {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--vert);
  }
  .match-card.a-venir .match-score {
    color: var(--gris);
    font-weight: 400;
    font-size: 0.75rem;
  }

  #empty-state {
    text-align: center;
    color: var(--gris);
    padding: 40px 16px;
    display: none;
  }

  footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--gris);
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <img class="cjf-logo" src="logos/cjf.png" alt="Logo CJF">
  <h1>CJF Fleury-les-Aubrais Volley</h1>
  <p>Planning des matchs — saison <span id="saison-label">…</span></p>
</header>

<main>
  <div id="views">
    <button id="view-planning" class="active">Planning</button>
    <button id="view-stats">Stats par catégorie</button>
  </div>
  <div id="tabs"></div>
  <label id="home-filter">
    <input type="checkbox" id="home-filter-checkbox">
    <span>🏠 Matchs à domicile uniquement</span>
  </label>
  <div id="status">Chargement…</div>
  <div id="content"></div>
  <div id="empty-state">Aucun match trouvé pour cette catégorie.</div>
</main>

<footer>
  Données FFVB, club 0456420 · dernière mise à jour <span id="last-updated">…</span>
</footer>

<script>
const MOIS_JOURS = ['dim','lun','mar','mer','jeu','ven','sam'];
const MOIS_LABEL = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS_LONG = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

let DB = null;
let LOGOS = {};
let CAT_LOGOS = {};
let activeCategory = 'ALL';
let viewMode = 'planning';
let homeOnly = false;

const STOPWORDS = new Set(['DE','DU','DES','LA','LE','LES','EN','SUR','ET','SAINT','ST','VOLLEY','VOLLEY-BALL','BALL','VB','CLUB','SPORTIVE','SPORTIF','UNION','SECTION','SP','US','U.S.','V.B.','ASSOCIATION','AS','A.S.']);

function initials(name) {
  const words = String(name).toUpperCase().replace(/[.'()]/g, ' ').split(/\s+/).filter(Boolean);
  const significant = words.filter(w => !STOPWORDS.has(w));
  const pool = significant.length ? significant : words;
  return pool.slice(0, 2).map(w => w[0]).join('') || '?';
}

function teamBadge(name) {
  const logo = LOGOS[name];
  if (logo) return `<img class="team-logo" src="${esc(logo)}" alt="${esc(name)}" loading="lazy">`;
  return `<span class="team-logo-fallback">${esc(initials(name))}</span>`;
}

// GYMNASE GUY MOCQUET is CJF's home gym: house badge for home games,
// bus badge for away games (based on the published venue, not team order).
function isDomicileVenue(m) {
  return !!m.lieu && /GUY MOCQUET/i.test(m.lieu);
}

function venueBadge(m) {
  if (!m.lieu) return '';
  return isDomicileVenue(m)
    ? '<span class="venue-badge domicile">🏠 Domicile</span>'
    : '<span class="venue-badge exterieur">🚌 Extérieur</span>';
}

function categoryChip(m) {
  const logo = CAT_LOGOS[m.categoryCode];
  const badge = logo
    ? `<img src="${esc(logo)}" alt="${esc(m.categoryCode || '')}" loading="lazy">`
    : `<span class="cat-fallback">${esc((m.categoryCode || '?').slice(0, 2))}</span>`;
  return `<span class="cat-chip" title="${esc(m.categoryLabel || '')}">${badge}</span>`;
}

function fmtJour(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return { court: MOIS_JOURS[d.getDay()] + ' ' + d.getDate(), long: d };
}

function fmtWeekLabel(iso) {
  const d = new Date(iso + 'T00:00:00');
  const fin = new Date(d.getTime() + 6 * 86400000);
  const sameMonth = d.getMonth() === fin.getMonth();
  const debut = d.getDate() + (sameMonth ? '' : ' ' + MOIS_LABEL[d.getMonth()]);
  const finStr = fin.getDate() + ' ' + MOIS_LABEL[fin.getMonth()];
  return 'Semaine du ' + debut + ' au ' + finStr;
}

function isHome(m) {
  return /CERCLE JULES FERRY/i.test(m.domicile);
}

// Best-effort: pulls two set-count numbers out of a raw score string like
// "3-1" or "3 / 1" so we can tell whether CJF won. Returns null if the
// score doesn't look like a simple "X-Y" set count.
function parseSetScore(m) {
  if (!m.score) return null;
  const match = m.score.match(/(\d+)\s*[-\/]\s*(\d+)/);
  if (!match) return null;
  const [a, b] = [Number(match[1]), Number(match[2])];
  const home = isHome(m);
  const cjfSets = home ? a : b;
  const oppSets = home ? b : a;
  if (Number.isNaN(cjfSets) || Number.isNaN(oppSets) || cjfSets === oppSets) return null;
  return cjfSets > oppSets ? 'V' : 'D';
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.textContent = 'Toutes les catégories';
  allBtn.className = activeCategory === 'ALL' ? 'active' : '';
  allBtn.onclick = () => { activeCategory = 'ALL'; render(); };
  tabs.appendChild(allBtn);

  for (const cat of DB.categories) {
    const btn = document.createElement('button');
    btn.textContent = cat.code;
    btn.title = cat.label;
    btn.className = activeCategory === cat.code ? 'active' : '';
    btn.onclick = () => { activeCategory = cat.code; render(); };
    tabs.appendChild(btn);
  }
}

function render() {
  document.getElementById('view-planning').className = viewMode === 'planning' ? 'active' : '';
  document.getElementById('view-stats').className = viewMode === 'stats' ? 'active' : '';
  document.getElementById('tabs').style.display = viewMode === 'planning' ? 'flex' : 'none';
  document.getElementById('home-filter').style.display = viewMode === 'planning' ? 'flex' : 'none';

  if (viewMode === 'stats') {
    renderStats();
  } else {
    renderPlanning();
  }
}

function renderPlanning() {
  renderTabs();
  const content = document.getElementById('content');
  const emptyState = document.getElementById('empty-state');
  content.innerHTML = '';

  const matches = DB.matches
    .filter(m => activeCategory === 'ALL' || m.categoryCode === activeCategory)
    .filter(m => !homeOnly || isHome(m));

  if (matches.length === 0) {
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  const byWeek = new Map();
  for (const m of matches) {
    if (!byWeek.has(m.weekStart)) byWeek.set(m.weekStart, []);
    byWeek.get(m.weekStart).push(m);
  }

  const weeks = [...byWeek.keys()].sort();
  for (const week of weeks) {
    const section = document.createElement('div');
    section.className = 'week-group';
    const h2 = document.createElement('h2');
    h2.textContent = fmtWeekLabel(week);
    section.appendChild(h2);

    for (const m of byWeek.get(week)) {
      section.appendChild(renderCard(m));
    }
    content.appendChild(section);
  }
}

function renderStats() {
  const content = document.getElementById('content');
  const emptyState = document.getElementById('empty-state');
  emptyState.style.display = 'none';
  content.innerHTML = '';

  const today = new Date().toISOString().slice(0, 10);
  const rows = DB.categories.map(cat => {
    const matches = DB.matches.filter(m => m.categoryCode === cat.code);
    const joues = matches.filter(m => m.statut === 'joue');
    const aVenir = matches.filter(m => m.statut !== 'joue');
    let victoires = 0, defaites = 0, indetermines = 0;
    for (const m of joues) {
      const r = parseSetScore(m);
      if (r === 'V') victoires++;
      else if (r === 'D') defaites++;
      else indetermines++;
    }
    const prochain = aVenir
      .filter(m => !m.date || m.date >= today)
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''))[0];

    return { cat, total: matches.length, joues: joues.length, aVenir: aVenir.length, victoires, defaites, indetermines, prochain };
  });

  const table = document.createElement('table');
  table.className = 'stats-table';
  table.innerHTML = `
    <thead>
      <tr>
        <th>Catégorie</th>
        <th>Matchs</th>
        <th>Joués</th>
        <th>À venir</th>
        <th>Bilan</th>
        <th>Prochain match</th>
      </tr>
    </thead>
    <tbody>
      ${rows.map(r => `
        <tr>
          <td>${esc(r.cat.code)}<span class="cat-label">${esc(r.cat.label)}</span></td>
          <td>${r.total}</td>
          <td>${r.joues}</td>
          <td>${r.aVenir}</td>
          <td>${renderBilan(r)}</td>
          <td>${r.prochain ? esc(fmtJour(r.prochain.date).court || r.prochain.dateAffichee) + ' — ' + esc(r.prochain.heure || '') : '—'}</td>
        </tr>
      `).join('')}
    </tbody>
  `;
  content.appendChild(table);

  const note = document.createElement('p');
  note.className = 'stats-note';
  note.textContent = 'Bilan calculé à partir des scores publiés par la FFVB — vide tant qu\'aucun match n\'a été joué ou si le score n\'a pas pu être interprété.';
  content.appendChild(note);
}

function renderBilan(r) {
  if (r.joues === 0) return '—';
  const parts = [];
  if (r.victoires) parts.push(`<span class="bilan-v">${r.victoires}V</span>`);
  if (r.defaites) parts.push(`<span class="bilan-d">${r.defaites}D</span>`);
  if (r.indetermines) parts.push(`${r.indetermines} score(s) non lu(s)`);
  return parts.join(' · ') || '—';
}

function renderCard(m) {
  const card = document.createElement('div');
  card.className = 'match-card ' + (m.statut === 'joue' ? 'joue' : 'a-venir');

  const j = fmtJour(m.date);
  const home = isHome(m);

  card.innerHTML = `
    <div class="match-top">
      <div class="match-datetime">
        <span class="jour">${esc(j.court || m.dateAffichee)}</span>
        <span class="heure">${esc(m.heure || '')}</span>
      </div>
      ${categoryChip(m)}
    </div>
    <div class="scoreboard">
      <div class="team-col ${home ? 'cjf' : ''}">
        ${teamBadge(m.domicile)}
        <span class="team-name">${esc(m.domicile)}</span>
      </div>
      <span class="vs-sep">VS</span>
      <div class="team-col ${!home ? 'cjf' : ''}">
        ${teamBadge(m.exterieur)}
        <span class="team-name">${esc(m.exterieur)}</span>
      </div>
    </div>
    <div class="match-bottom">
      <span class="lieu">${venueBadge(m)}${m.lieu ? esc(m.lieu) : ''}</span>
      <span class="match-score">${m.score ? esc(m.score) : (m.statut === 'joue' ? '' : 'à venir')}</span>
    </div>
  `;
  return card;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('view-planning').onclick = () => { viewMode = 'planning'; render(); };
document.getElementById('view-stats').onclick = () => { viewMode = 'stats'; render(); };
document.getElementById('home-filter-checkbox').onchange = (e) => { homeOnly = e.target.checked; render(); };

Promise.all([
  fetch('data/matches.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
  fetch('data/club-logos.json').then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch('data/category-logos.json').then(r => r.ok ? r.json() : {}).catch(() => ({})),
])
  .then(([db, logos, catLogos]) => {
    DB = db;
    LOGOS = logos;
    CAT_LOGOS = catLogos;
    document.getElementById('saison-label').textContent = db.saison;
    document.getElementById('last-updated').textContent = new Date(db.lastUpdated).toLocaleString('fr-FR');
    document.getElementById('status').textContent = db.matches.length + ' match(s) programmés sur la saison';
    render();
  })
  .catch(err => {
    document.getElementById('status').textContent = 'Erreur de chargement des données : ' + err.message;
  });
</script>

</body>
</html>
